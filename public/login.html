<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Piensos y Cereales Urbano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-100 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <div class="text-center mb-6">
            <img src="img/logo-empresa.jpg" alt="Piensos y Cereales Urbano, S.L." class="w-24 h-24 mx-auto rounded-full object-cover">
            <h1 class="text-xl font-bold text-gray-800 mt-3">Piensos y Cereales Urbano, S.L.</h1>
            <p class="text-sm text-gray-500">Inicia sesión para continuar</p>
        </div>
        <form id="loginForm" novalidate>
            <div class="mb-4">
                <label for="nombre_usuario" class="campo-label campo-obligatorio">Usuario</label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" autocomplete="username"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#20c997]" required>
            </div>
            <div class="mb-6">
                <label for="contrasena" class="campo-label campo-obligatorio">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" autocomplete="current-password"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#20c997]" required>
            </div>
            <button type="submit" class="w-full bg-[#158765] text-white py-2 rounded-lg hover:bg-[#0f6b50] transition-colors duration-200 font-medium">
                <i class="fas fa-right-to-bracket mr-1"></i> Entrar
            </button>
            <p id="mensajeError" class="text-red-500 text-center mt-4 hidden"></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value;
            const mensajeError = document.getElementById('mensajeError');
            mensajeError.classList.add('hidden');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre_usuario, contrasena })
                });
                const data = await res.json();

                if (res.ok) {
                    window.location.href = '/index.html';
                } else {
                    mensajeError.textContent = data.error || 'No se pudo iniciar sesión.';
                    mensajeError.classList.remove('hidden');
                }
            } catch (err) {
                mensajeError.textContent = 'Error de conexión. Inténtalo de nuevo.';
                mensajeError.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
