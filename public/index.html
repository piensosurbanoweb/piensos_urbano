<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 border-b">
                <button onclick="cambiarPestana('BaseDatos')" id="tabBaseDatos"
                        class="px-3 py-3 text-center font-medium bg-blue-600 text-white text-xs sm:text-sm">
                    <i class="fas fa-database mr-1"></i> Base de Datos
                </button>
                <button onclick="cambiarPestana('NuevoPedido')" id="tabNuevoPedido"
                        class="px-3 py-3 text-center font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 text-xs sm:text-sm">
                    <i class="fas fa-cart-plus mr-1"></i> Nuevo Pedido
                </button>
                <button onclick="cambiarPestana('Pendientes')" id="tabPendientes"
                        class="px-3 py-3 text-center font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 text-xs sm:text-sm">
                    <i class="fas fa-clipboard-list mr-1"></i> Pendientes
                    <span id="totalPendientes" class="bg-red-500 text-white rounded-full px-2 py-1 text-xs ml-1">0</span>
                </button>
                <button onclick="cambiarPestana('Calendario')" id="tabCalendario"
                        class="px-3 py-3 text-center font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 text-xs sm:text-sm">
                    <i class="fas fa-calendar-days mr-1"></i> Calendario
                </button>
                <button onclick="cambiarPestana('GestionBBDD')" id="tabGestionBBDD"
                        class="px-3 py-3 text-center font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 text-xs sm:text-sm">
                    <i class="fas fa-gear mr-1"></i> Gestión BD
                </button>
                <button onclick="cambiarPestana('HojaReparto')" id="tabHojaReparto"
                        class="px-3 py-3 text-center font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 text-xs sm:text-sm">
                    <i class="fas fa-truck mr-1"></i> Hoja Reparto
                </button>
            </div>
        </div>

        <div id="contenidoPestanas" class="mt-8">
            </div>
    </div>
    <script src="js/functions_copy_claude.js" defer></script>
</body>
</html>
