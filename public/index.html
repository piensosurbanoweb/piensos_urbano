<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piensos y Cereales Urbano</title>
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico?v=2" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
    <!-- Para exportar a Excel (clientes) y PDF (hoja de reparto, historial de cliente) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-100 min-h-screen">
    <header class="no-print sticky top-0 z-40 bg-white shadow-md">
        <div class="w-full px-6 py-2 flex items-center gap-4">
            <div class="flex items-center gap-2 shrink-0">
                <img src="img/logo-empresa.jpg" alt="Piensos y Cereales Urbano, S.L." class="w-9 h-9 rounded-full object-cover">
                <span class="hidden md:inline font-bold text-gray-800 text-sm whitespace-nowrap">Piensos y Cereales Urbano</span>
            </div>

            <div class="flex-1"></div>

            <div class="relative shrink-0">
                <button id="btnMenuUsuario" onclick="toggleMenuUsuario()"
                        class="w-10 h-10 rounded-full bg-[#158765] hover:bg-[#0f6b50] text-white flex items-center justify-center font-semibold transition-colors duration-200">
                    <span id="usuarioIniciales">?</span>
                </button>
                <div id="menuUsuario" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-lg shadow-lg border z-50">
                    <div class="px-4 py-3 border-b">
                        <p id="usuarioActual" class="font-medium text-gray-800"></p>
                        <p id="usuarioRolLabel" class="text-xs text-gray-500 mt-0.5"></p>
                    </div>
                    <button onclick="abrirModalEditarPerfil()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2">
                        <i class="fas fa-user-pen text-gray-500"></i> Editar mi perfil
                    </button>
                    <button onclick="abrirModalCambiarPassword()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2">
                        <i class="fas fa-key text-gray-500"></i> Cambiar contraseña
                    </button>
                    <a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=piensosurbanoweb@gmail.com&amp;su=Soporte%20-%20Piensos%20y%20Cereales%20Urbano" target="_blank" rel="noopener" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-gray-700">
                        <i class="fas fa-circle-question text-gray-500"></i> ¿Algo no funciona? Soporte
                    </a>
                    <button onclick="cerrarSesion()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-red-600 border-t">
                        <i class="fas fa-right-from-bracket"></i> Cerrar sesión
                    </button>
                </div>
            </div>
        </div>
        <nav class="w-full bg-gray-50 border-t border-b border-gray-200 overflow-x-auto">
            <div class="flex w-full min-w-max sm:min-w-0">
                <button onclick="cambiarPestana('BaseDatos')" id="tabBaseDatos"
                        class="flex-1 px-3 py-3 text-center font-medium text-xs sm:text-sm border-b-2 transition-colors duration-200">
                    <i class="fas fa-database mr-1"></i> Base de Datos
                </button>
                <button onclick="cambiarPestana('NuevoPedido')" id="tabNuevoPedido"
                        class="flex-1 px-3 py-3 text-center font-medium text-xs sm:text-sm border-b-2 transition-colors duration-200">
                    <i class="fas fa-cart-plus mr-1"></i> Nuevo Pedido
                </button>
                <button onclick="cambiarPestana('Pendientes')" id="tabPendientes"
                        class="flex-1 px-3 py-3 text-center font-medium text-xs sm:text-sm border-b-2 transition-colors duration-200">
                    <i class="fas fa-clipboard-list mr-1"></i> Pendientes
                    <span id="totalPendientes" class="bg-red-500 text-white rounded-full px-2 py-1 text-xs ml-1">0</span>
                </button>
                <button onclick="cambiarPestana('Calendario')" id="tabCalendario"
                        class="flex-1 px-3 py-3 text-center font-medium text-xs sm:text-sm border-b-2 transition-colors duration-200">
                    <i class="fas fa-calendar-days mr-1"></i> Calendario
                </button>
                <button onclick="cambiarPestana('HojaReparto')" id="tabHojaReparto"
                        class="flex-1 px-3 py-3 text-center font-medium text-xs sm:text-sm border-b-2 transition-colors duration-200">
                    <i class="fas fa-truck mr-1"></i> Hoja Reparto
                </button>
                <button onclick="cambiarPestana('GestionBBDD')" id="tabGestionBBDD"
                        class="flex-1 px-3 py-3 text-center font-medium text-xs sm:text-sm border-b-2 transition-colors duration-200">
                    <i class="fas fa-gear mr-1"></i> Gestión BD
                </button>
            </div>
        </nav>
    </header>

    <div id="contenidoPrincipal" class="mx-auto px-8 py-8 max-w-[1280px]">
        <div id="modalEditarPerfil" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
            <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4"><i class="fas fa-user-pen mr-1"></i> Editar mi perfil</h3>
                <form id="formEditarPerfil" novalidate>
                    <div class="mb-3">
                        <label class="campo-label campo-obligatorio">Nombre</label>
                        <input type="text" id="perfilNombre" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-[#20c997]" required>
                    </div>
                    <div class="mb-4">
                        <label class="campo-label campo-opcional">Email <span class="text-xs text-gray-400 font-normal">(para recuperar tu contraseña)</span></label>
                        <input type="email" id="perfilEmail" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-[#20c997]">
                    </div>
                    <p id="mensajeEditarPerfil" class="text-sm mb-3 hidden"></p>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="cerrarModalEditarPerfil()" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100">Cancelar</button>
                        <button type="submit" class="px-4 py-2 rounded-lg bg-[#158765] hover:bg-[#0f6b50] text-white font-medium">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modalCambiarPassword" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
            <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4"><i class="fas fa-key mr-1"></i> Cambiar contraseña</h3>
                <form id="formCambiarPassword" novalidate>
                    <div class="mb-3">
                        <label class="campo-label campo-obligatorio">Contraseña actual</label>
                        <input type="password" id="passwordActual" autocomplete="current-password" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-[#20c997]" required>
                    </div>
                    <div class="mb-3">
                        <label class="campo-label campo-obligatorio">Contraseña nueva</label>
                        <input type="password" id="passwordNueva" minlength="8" autocomplete="new-password" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-[#20c997]" required>
                    </div>
                    <div class="mb-4">
                        <label class="campo-label campo-obligatorio">Repite la contraseña nueva</label>
                        <input type="password" id="passwordNuevaConfirmar" minlength="8" autocomplete="new-password" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-[#20c997]" required>
                    </div>
                    <p id="mensajeCambiarPassword" class="text-sm mb-3 hidden"></p>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="cerrarModalCambiarPassword()" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100">Cancelar</button>
                        <button type="submit" class="px-4 py-2 rounded-lg bg-[#158765] hover:bg-[#0f6b50] text-white font-medium">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modalConfirmacion" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
            <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-5">
                <div class="flex items-start gap-3 mb-5">
                    <div class="w-9 h-9 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">
                        <i class="fas fa-triangle-exclamation"></i>
                    </div>
                    <p id="mensajeConfirmacion" class="text-sm text-gray-700 mt-1.5"></p>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" id="btnCancelarConfirmacion" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 text-sm">Cancelar</button>
                    <button type="button" id="btnAceptarConfirmacion" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium text-sm">Eliminar</button>
                </div>
            </div>
        </div>

        <!-- Modal compartido para editar un pedido (desde Pendientes o desde Calendario) -->
        <div id="modalEditarPedido" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">Editar Pedido</h3>
                    <button type="button" onclick="cerrarModalEditarPedido()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
                </div>

                <div class="mb-4">
                    <label class="campo-label campo-obligatorio">Productos del pedido</label>
                    <div id="editarItemsPedidoLista" class="space-y-2"></div>
                    <button type="button" onclick="agregarFilaItemEditar()" class="mt-2 inline-flex items-center gap-1 text-sm text-[#158765] hover:text-[#0f6b50] font-medium">
                        <i class="fas fa-circle-plus"></i> Añadir otro producto
                    </button>
                    <p id="errorItemsEditar" class="campo-error hidden mt-1">Añade al menos un producto con su cantidad.</p>
                </div>

                <div class="mb-4">
                    <label class="campo-label campo-opcional" for="editarFechaPedido">Fecha</label>
                    <input type="date" id="editarFechaPedido" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#20c997]">
                </div>

                <div class="mb-2">
                    <label class="campo-label campo-opcional" for="editarObservacionesPedido">Observaciones</label>
                    <textarea id="editarObservacionesPedido" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#20c997]"></textarea>
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="cerrarModalEditarPedido()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-lg font-medium text-sm">Cancelar</button>
                    <button type="button" onclick="guardarEdicionPedido()" class="px-4 py-2 bg-[#158765] hover:bg-[#0f6b50] text-white rounded-lg font-medium text-sm">Guardar Cambios</button>
                </div>
            </div>
        </div>

        <div id="modalAviso" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
            <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6">
                <div class="flex flex-col items-center text-center gap-3 mb-6">
                    <div id="iconoAviso" class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center shrink-0 text-2xl">
                        <i class="fas fa-circle-check"></i>
                    </div>
                    <p id="mensajeAviso" class="text-sm text-gray-700 whitespace-pre-line"></p>
                </div>
                <div class="flex justify-center">
                    <button type="button" id="btnAceptarAviso" class="px-6 py-2 rounded-lg bg-[#158765] hover:bg-[#0f6b50] text-white font-medium text-sm">Aceptar</button>
                </div>
            </div>
        </div>

        <div id="contenidoPestanas" class="mt-4">
            </div>
    </div>
    <script src="js/functions_copy_claude.js" defer></script>
</body>
</html>
