<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña — Piensos y Cereales Urbano</title>
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico?v=2" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-100 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <div class="text-center mb-6">
            <img src="img/logo-empresa.jpg" alt="Piensos y Cereales Urbano, S.L." class="w-24 h-24 mx-auto rounded-full object-cover">
            <h1 class="text-xl font-bold text-gray-800 mt-3">Pon tu nueva contraseña</h1>
        </div>
        <form id="resetForm" novalidate>
            <div class="mb-4">
                <label for="contrasena" class="campo-label campo-obligatorio">Contraseña nueva</label>
                <div class="relative">
                    <input type="password" id="contrasena" name="contrasena" minlength="8" autocomplete="new-password"
                        class="w-full px-3 py-2 pr-10 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#20c997]" required>
                    <button type="button" id="toggleContrasena" tabindex="-1"
                        class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-6">
                <label for="contrasenaConfirmar" class="campo-label campo-obligatorio">Repite la contraseña</label>
                <input type="password" id="contrasenaConfirmar" minlength="8" autocomplete="new-password"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#20c997]" required>
            </div>
            <button type="submit" class="w-full bg-[#158765] text-white py-2 rounded-lg hover:bg-[#0f6b50] transition-colors duration-200 font-medium">
                <i class="fas fa-check mr-1"></i> Guardar contraseña
            </button>
            <p id="mensaje" class="text-center mt-4 hidden"></p>
        </form>
    </div>

    <script>
        document.getElementById('toggleContrasena').addEventListener('click', () => {
            const campo = document.getElementById('contrasena');
            const icono = document.querySelector('#toggleContrasena i');
            const mostrar = campo.type === 'password';
            campo.type = mostrar ? 'text' : 'password';
            icono.classList.toggle('fa-eye', !mostrar);
            icono.classList.toggle('fa-eye-slash', mostrar);
        });

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const mensaje = document.getElementById('mensaje');

        if (!token) {
            mensaje.textContent = 'Este enlace no es válido. Pide uno nuevo desde "¿Olvidaste tu contraseña?".';
            mensaje.className = 'text-center mt-4 text-red-500';
            mensaje.classList.remove('hidden');
            document.getElementById('resetForm').querySelectorAll('input, button').forEach(el => el.disabled = true);
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const contrasena = document.getElementById('contrasena').value;
            const confirmar = document.getElementById('contrasenaConfirmar').value;
            mensaje.classList.add('hidden');

            if (contrasena !== confirmar) {
                mensaje.textContent = 'Las dos contraseñas no coinciden.';
                mensaje.className = 'text-center mt-4 text-red-500';
                mensaje.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, contrasena })
                });
                const data = await res.json();
                if (res.ok) {
                    mensaje.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión.';
                    mensaje.className = 'text-center mt-4 text-green-600';
                    mensaje.classList.remove('hidden');
                    setTimeout(() => { window.location.href = '/login'; }, 1800);
                } else {
                    mensaje.textContent = data.error || 'No se pudo actualizar la contraseña.';
                    mensaje.className = 'text-center mt-4 text-red-500';
                    mensaje.classList.remove('hidden');
                }
            } catch (err) {
                mensaje.textContent = 'Error de conexión. Inténtalo de nuevo.';
                mensaje.className = 'text-center mt-4 text-red-500';
                mensaje.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
