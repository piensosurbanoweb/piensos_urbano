<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — Piensos y Cereales Urbano</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-100 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <div class="text-center mb-6">
            <img src="img/logo-empresa.jpg" alt="Piensos y Cereales Urbano, S.L." class="w-24 h-24 mx-auto rounded-full object-cover">
            <h1 class="text-xl font-bold text-gray-800 mt-3">Recuperar contraseña</h1>
            <p class="text-sm text-gray-500">Te enviaremos un enlace a tu email para poner una nueva</p>
        </div>
        <form id="forgotForm" novalidate>
            <div class="mb-6">
                <label for="usuario_o_email" class="campo-label campo-obligatorio">Usuario o email</label>
                <input type="text" id="usuario_o_email" name="usuario_o_email"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#20c997]" required>
            </div>
            <button type="submit" class="w-full bg-[#158765] text-white py-2 rounded-lg hover:bg-[#0f6b50] transition-colors duration-200 font-medium">
                <i class="fas fa-paper-plane mr-1"></i> Enviar enlace
            </button>
            <p id="mensaje" class="text-center mt-4 hidden"></p>
        </form>
        <p class="text-center mt-4">
            <a href="login.html" class="text-sm text-gray-500 hover:text-[#158765]"><i class="fas fa-arrow-left mr-1"></i> Volver al inicio de sesión</a>
        </p>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario_o_email = document.getElementById('usuario_o_email').value.trim();
            const mensaje = document.getElementById('mensaje');
            const boton = e.target.querySelector('button[type="submit"]');
            boton.disabled = true;

            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario_o_email })
                });
                const data = await res.json();
                mensaje.textContent = data.message || 'Si esa cuenta existe, recibirás un correo en breve.';
                mensaje.className = 'text-center mt-4 text-green-600';
                mensaje.classList.remove('hidden');
            } catch (err) {
                mensaje.textContent = 'Error de conexión. Inténtalo de nuevo.';
                mensaje.className = 'text-center mt-4 text-red-500';
                mensaje.classList.remove('hidden');
                boton.disabled = false;
            }
        });
    </script>
</body>
</html>
